name: 插件构建与发布

run-name: ${{ github.event_name == 'workflow_dispatch' && format('手动发布 {0}', github.event.inputs.plugin_id) || format('自动发布触发者：{0}', github.triggering_actor) }}

on:
  workflow_dispatch:
    inputs:
      source_directory:
        description: '请选择插件源码所在的根目录'
        required: true
        type: choice
        options:
          - plugins
          - plugins.v2
          - plugins.v3
        default: 'plugins.v3'
      plugin_id:
        description: '请输入 package.json 中的插件 ID (例如: MessageRouter)'
        required: true
        type: string
      prerelease:
        description: '是否为预发布版本？'
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - 'package*.json'

jobs:
  detect-changes:
    name: 检测待发布插件
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detector.outputs.plugins }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect plugins to release using Python script
        id: detector
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
          INPUT_SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PLUGINS_JSON=$(python3 .github/scripts/get_plugin_meta.py)

          if ! echo "$PLUGINS_JSON" | jq .; then
            echo "[error] Python 脚本返回的不是有效的 JSON。请检查日志。"
            exit 1
          fi

          echo "plugins=$PLUGINS_JSON" >> $GITHUB_OUTPUT

  start-release-jobs:
    name: 准备发布
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    steps:
      - name: Log detected plugins
        run: |
          echo "检测到需要发布的插件，将启动构建和发布任务..."
          echo '插件列表: ${{ needs.detect-changes.outputs.matrix }}'

  build-and-release:
    needs: [start-release-jobs, detect-changes]
    name: 发布 ${{ matrix.plugin.name }} v${{ matrix.plugin.version }} ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) && '（预发布）' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 仅当插件目录确实存在 package.json（联邦前端插件）时才初始化 Node。
      # 纯 Python 插件（如 p115strmhelper）没有 package-lock.json，
      # setup-node 会因缓存路径解析失败而直接中断整个发布任务。
      - name: Setup Node.js
        if: ${{ hashFiles(format('{0}/{1}/package.json', matrix.plugin.backend_worker_path, matrix.plugin.backend_path)) != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.plugin.backend_worker_path }}/${{ matrix.plugin.backend_path }}/package-lock.json

      # 以 package.json 是否存在来判定是否为联邦前端插件，
      # 这样同一代际里的纯 Python 插件也能安全跳过，不会误报构建失败。
      - name: Build frontend assets
        run: |
          set -euo pipefail
          FULL_SOURCE_PATH="${{ matrix.plugin.backend_worker_path }}/${{ matrix.plugin.backend_path }}"

          if [ ! -d "$FULL_SOURCE_PATH" ]; then
            echo "[Error] 未找到源目录: $FULL_SOURCE_PATH"
            exit 1
          fi

          if [ ! -f "$FULL_SOURCE_PATH/package.json" ]; then
            echo "[Info] $FULL_SOURCE_PATH 无 package.json，按纯后端插件处理，跳过前端构建。"
            exit 0
          fi

          echo "[Info] 检测到联邦前端插件，开始构建前端产物..."
          cd "$FULL_SOURCE_PATH"

          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run build:web

          if [ ! -d "dist" ]; then
            echo "[Error] 前端构建完成后未找到 dist 目录"
            exit 1
          fi

          # 联邦插件必须有 remoteEntry.js，否则宿主加载时会报「组件加载错误」
          if [ ! -f "dist/assets/remoteEntry.js" ]; then
            echo "[Error] 未生成 dist/assets/remoteEntry.js，联邦组件无法被宿主加载"
            ls -lR dist || true
            exit 1
          fi

          echo "[Info] 前端产物已生成："
          ls -l dist/assets

      # MoviePilot V3 已移除插件 ZIP 上传接口，安装只能走 GitHub 仓库目录或 Release 资产。
      # Release 失败时后端会静默回退到「文件清单安装」——按仓库目录逐文件下载。
      # 若仓库里没有 dist，那次回退就会把插件目录里已有的 dist 覆盖掉，直接变成「组件加载错误」。
      # 所以必须把 dist 提交回仓库（官方 MoviePilot-Plugins 仓库也是这么做的）。
      - name: Commit dist back to repository
        run: |
          set -euo pipefail
          DIST_PATH="${{ matrix.plugin.backend_worker_path }}/${{ matrix.plugin.backend_path }}/dist"

          if [ ! -d "$DIST_PATH" ]; then
            echo "[Info] 无 dist 目录，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f：即使 .gitignore 里还残留 dist/ 规则也强制入库，避免静默跳过
          git add -f "$DIST_PATH"

          if git diff --cached --quiet; then
            echo "[Info] dist 无变化，跳过提交。"
          else
            git commit -m "chore(${{ matrix.plugin.backend_path }}): 重建并提交前端联邦产物 dist"
            git push
          fi

      - name: Package plugin source code
        run: |
          set -euo pipefail
          FULL_SOURCE_PATH="${{ matrix.plugin.backend_worker_path }}/${{ matrix.plugin.backend_path }}"
          STAGING_ROOT="$RUNNER_TEMP/release-package"
          STAGING_PLUGIN_PATH="$STAGING_ROOT/${{ matrix.plugin.backend_path }}"

          if [ ! -d "$FULL_SOURCE_PATH" ]; then
            echo "[Error] 未找到源目录: $FULL_SOURCE_PATH"
            exit 1
          fi

          echo "[Info] 打包工作将在 '${{ matrix.plugin.backend_worker_path }}' 目录下进行..."
          echo "[Info] 目标插件目录是 '${{ matrix.plugin.backend_path }}'..."

          rm -rf "$STAGING_ROOT"
          mkdir -p "$STAGING_PLUGIN_PATH"

          if [ -f "$FULL_SOURCE_PATH/package.json" ] && [ -d "$FULL_SOURCE_PATH/dist" ]; then
            echo "[Info] 联邦前端插件：仅打包最终运行所需文件..."

            if [ ! -f "$FULL_SOURCE_PATH/__init__.py" ]; then
              echo "[Error] 缺少必要文件: $FULL_SOURCE_PATH/__init__.py"
              exit 1
            fi
            cp "$FULL_SOURCE_PATH/__init__.py" "$STAGING_PLUGIN_PATH/__init__.py"

            if [ -f "$FULL_SOURCE_PATH/requirements.txt" ]; then
              cp "$FULL_SOURCE_PATH/requirements.txt" "$STAGING_PLUGIN_PATH/requirements.txt"
            fi

            cp -R "$FULL_SOURCE_PATH/dist" "$STAGING_PLUGIN_PATH/dist"
          else
            echo "[Info] 非联邦前端插件，保持原有整目录打包逻辑..."
            cp -R "$FULL_SOURCE_PATH/." "$STAGING_PLUGIN_PATH/"
          fi

          tar -czvf "${{ matrix.plugin.archive_base }}.tar.gz" -C "$STAGING_ROOT" "${{ matrix.plugin.backend_path }}"
          (cd "$STAGING_ROOT" && zip -r "$GITHUB_WORKSPACE/${{ matrix.plugin.archive_base }}.zip" "${{ matrix.plugin.backend_path }}")

          sha256sum "${{ matrix.plugin.archive_base }}.zip" > "${{ matrix.plugin.archive_base }}.zip.sha256"
          sha256sum "${{ matrix.plugin.archive_base }}.tar.gz" > "${{ matrix.plugin.archive_base }}.tar.gz.sha256"

      - name: Check and delete existing tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ matrix.plugin.tag_name }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "[Info] 手动模式：允许覆盖已存在的发布。"
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "[Warn] 发现已存在的 Release: $TAG_NAME。将被覆盖，正在删除..."
              gh release delete "$TAG_NAME" --yes
            else
              echo "[Info] 未发现已存在的 Release，将直接创建。"
            fi

            if [ -n "$(git ls-remote --tags origin "$TAG_NAME")" ]; then
              echo "[Warn] 发现已存在的远程 Git Tag: $TAG_NAME。将被覆盖，正在删除..."
              git push origin --delete "$TAG_NAME"
            else
              echo "[Info] 未发现已存在的远程 Git Tag，将直接创建。"
            fi
          else
            echo "[Info] 自动模式：检查是否存在冲突的发布。"

            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "[Fatal] 自动模式失败：Release with tag '$TAG_NAME' 已存在。请手动删除或更新版本号。"
              exit 1
            fi

            if [ -n "$(git ls-remote --tags origin "$TAG_NAME")" ]; then
              echo "[Fatal] 自动模式失败：Git Tag '$TAG_NAME' 已存在。请手动删除或更新版本号。"
              exit 1
            fi

            echo "[Info] 检查通过，不存在同名 Release 或 Tag，可以安全发布。"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.plugin.tag_name }}
          name: ${{ matrix.plugin.name }} v${{ matrix.plugin.version }} ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) && ' (Prerelease)' || '' }}
          body: ${{ matrix.plugin.notes }}
          files: |
            ${{ matrix.plugin.archive_base }}.zip
            ${{ matrix.plugin.archive_base }}.tar.gz
            ${{ matrix.plugin.archive_base }}.zip.sha256
            ${{ matrix.plugin.archive_base }}.tar.gz.sha256
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
